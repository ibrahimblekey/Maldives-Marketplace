services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maldives_marketplace
    ports:
      - "5432:5432"
    volumes:
      - maldives_marketplace_pgdata:/var/lib/postgresql/data

volumes:
  maldives_marketplace_pgdata:
